services:

  postgres:
    image: postgres:17

    container_name: food-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fooddb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: food-api

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres

volumes:
  postgres_data: