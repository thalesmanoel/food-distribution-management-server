services:

  postgres:
    image: postgres:17

    container_name: food-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fooddb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: food-redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  api:
    build: .

    container_name: food-api

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: